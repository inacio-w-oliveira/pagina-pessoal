<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada — Inácio Wellington Oliveira</title>
  <meta name="description" content="O endereço que você tentou abrir não existe ou mudou.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('iwo.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
  <main id="main" class="section error-page">
    <div class="container">
      <p class="eyebrow">Erro 404</p>
      <h1>Página não encontrada</h1>
      <p class="lead">O endereço que você tentou abrir não existe ou mudou.</p>
      <a class="btn btn--primary" href="./">Voltar ao início</a>
      <p class="error-page__alt">Page not found — <a href="./">back to home</a>.</p>
    </div>
  </main>
</body>
</html>
